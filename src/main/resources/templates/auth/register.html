<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Inscription')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main class="main-content auth-wrapper">
        <div class="auth-card" style="max-width: 540px;">
            <div class="auth-header">
                <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px;">
                    <i data-lucide="user-plus" style="width: 24px; height: 24px;"></i>
                </div>
                <h1 class="auth-title">Inscription</h1>
                <p class="text-sm">Rejoignez Workly en quelques secondes</p>
            </div>

            <!-- Error message -->
            <div th:if="${errorMessage}" class="alert alert-danger">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
                    <span th:text="${errorMessage}">Erreur</span>
                </div>
                <button type="button" class="alert-close">&times;</button>
            </div>

            <form th:action="@{/register}" method="post">
                
                <!-- Role Selector -->
                <div class="form-group">
                    <label class="form-label">Vous êtes :</label>
                    <div class="role-selector-grid">
                        <div>
                            <input type="radio" id="roleCandidate" name="role" value="CONDIDATE" class="role-radio-input" checked>
                            <label for="roleCandidate" class="role-radio-label">
                                <span class="role-icon">🎯</span>
                                <span style="font-weight: 700; color: var(--primary);">Candidat</span>
                                <span class="text-xs" style="color: var(--text-muted); margin-top: 0.2rem;">À la recherche d'un emploi</span>
                            </label>
                        </div>
                        <div>
                            <input type="radio" id="roleRecruiter" name="role" value="RECRUITER" class="role-radio-input">
                            <label for="roleRecruiter" class="role-radio-label">
                                <span class="role-icon">🏢</span>
                                <span style="font-weight: 700; color: var(--primary);">Recruteur</span>
                                <span class="text-xs" style="color: var(--text-muted); margin-top: 0.2rem;">Je recrute des talents</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="firstname">Prénom</label>
                        <input type="text" id="firstname" name="firstname" class="form-control" placeholder="Jean" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="lastname">Nom</label>
                        <input type="text" id="lastname" name="lastname" class="form-control" placeholder="Dupont" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="jean.dupont@exemple.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 caractères" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1rem;">
                    <i data-lucide="check" style="width: 18px; height: 18px;"></i>
                    <span>Créer mon compte</span>
                </button>
            </form>

            <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light);">
                <a th:href="@{/}" class="btn btn-outline" style="width: 100%;">
                    <i data-lucide="house" style="width: 16px; height: 16px;"></i>
                    <span>Retour à l'accueil</span>
                </a>
                <a th:href="@{/login}" class="btn btn-outline-primary" style="width: 100%;">
                    <i data-lucide="log-in" style="width: 16px; height: 16px;"></i>
                    <span>Se connecter</span>
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
