<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ? ${title} + ' - Workly' : 'Workly - Plateforme de Recrutement & Emploi'">Workly</title>
    <!-- Google Fonts & Lucide Icons CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

    <!-- Global Top Navbar -->
    <header th:fragment="navbar" class="navbar">
        <div class="container navbar-inner">
            <a th:href="@{/}" class="navbar-brand">
                <div class="brand-icon">
                    <i data-lucide="briefcase" style="width: 22px; height: 22px;"></i>
                </div>
                <span>Work<span style="color: var(--accent);">ly</span></span>
            </a>

            <!-- Right Actions: Only Sortir if logged in, only Connexion + S'inscrire if anonymous -->
            <div class="navbar-actions">
                <!-- Anonymous actions (Hors connexion) -->
                <div sec:authorize="isAnonymous()" style="display: flex; align-items: center; gap: 0.75rem;">
                    <a th:href="@{/login}" class="btn btn-outline">Connexion</a>
                    <a th:href="@{/register}" class="btn btn-primary">S'inscrire</a>
                </div>

                <!-- Authenticated action (Connecté: Uniquement bouton Sortir) -->
                <div sec:authorize="isAuthenticated()" style="display: flex; align-items: center;">
                    <form th:action="@{/logout}" method="post" style="margin: 0;">
                        <button type="submit" class="btn btn-outline btn-sm" title="Déconnexion">
                            <i data-lucide="log-out" style="width: 16px; height: 16px;"></i>
                            <span>Se déconnecter

                            </span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <!-- Global Flash Alerts Fragment -->
    <div th:fragment="alerts" class="container" style="margin-top: 1.5rem;" th:if="${successMessage != null or errorMessage != null or infoMessage != null}">
        <div th:if="${successMessage}" class="alert alert-success">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="check-circle" style="width: 20px; height: 20px;"></i>
                <span th:text="${successMessage}">Succès</span>
            </div>
            <button type="button" class="alert-close">&times;</button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="alert-triangle" style="width: 20px; height: 20px;"></i>
                <span th:text="${errorMessage}">Erreur</span>
            </div>
            <button type="button" class="alert-close">&times;</button>
        </div>
        <div th:if="${infoMessage}" class="alert alert-warning">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="info" style="width: 20px; height: 20px;"></i>
                <span th:text="${infoMessage}">Information</span>
            </div>
            <button type="button" class="alert-close">&times;</button>
        </div>
    </div>

    <!-- Global Footer -->
    <footer th:fragment="footer" class="footer">
        <div class="container footer-inner">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <div class="brand-icon" style="width: 32px; height: 32px;">
                    <i data-lucide="briefcase" style="width: 18px; height: 18px;"></i>
                </div>
                <span style="font-weight: 700; color: white;">Workly &copy; 2026</span>
            </div>
            <div class="footer-copy">
                Plateforme intelligente de recrutement & gestion de carrières professionnelles.
            </div>
            <div style="display: flex; gap: 1rem;">
                <a th:href="@{/jobs}" style="color: #94A3B8; font-size: 0.9rem;">Explorer les offres</a>
                <a th:href="@{/login}" style="color: #94A3B8; font-size: 0.9rem;">Espace Membre</a>
            </div>
        </div>
        <script th:src="@{/js/main.js}"></script>
        <script>
            lucide.createIcons();
        </script>
    </footer>

</body>
</html>
